server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/passe}
    username: ${DB_USER:passe}
    password: ${DB_PASSWORD:passe}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: America/Sao_Paulo
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      allow-coercion-of-scalars: false

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}